name: Build and Push Krea 2 RunPod Image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile.krea2-runpod"
      - "data/krea2_baked_loras.json"
      - "runpod/download_baked_loras.py"
      - "comfyui_custom_nodes/ComfyUI-Megumin-NanoGPT/**"
      - "comfyui_custom_nodes/ComfyUI-Megumin-RuntimeLora/**"
      - ".github/workflows/krea2-runpod-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: krea2-runpod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Require CivitAI API token
        env:
          CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
        run: |
          if [ -z "$CIVITAI_API_TOKEN" ]; then
            echo "::error::Add repository secret CIVITAI_API_TOKEN (Civitai account API key). Baked LoRA downloads return 401 without it."
            exit 1
          fi

      - name: Build and push Krea 2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.krea2-runpod
          push: true
          secrets: |
            civitai_api_token=${{ secrets.CIVITAI_API_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
